[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "murmur-ime-voice"
version = "0.1.0a8"
description = "Volcengine voice daemon for Open Voice Input Linux"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = [
  "sounddevice>=0.4.6,<1",
  "websockets>=13,<18",
]

[project.urls]
Homepage = "https://github.com/SidUParis/openVoiceInput_linux"
Repository = "https://github.com/SidUParis/openVoiceInput_linux"
Issues = "https://github.com/SidUParis/openVoiceInput_linux/issues"
Documentation = "https://github.com/SidUParis/openVoiceInput_linux#readme"
Security = "https://github.com/SidUParis/openVoiceInput_linux/security/policy"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
murmur-voice-daemon = "murmur_voice.cli:main"
open-voice-input-settings = "murmur_voice.settings_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["murmur_voice*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

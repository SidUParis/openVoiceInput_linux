name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gir1.2-ibus-1.0 \
            python3-gi \
            python3-venv
      - name: Create isolated test environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --disable-pip-version-check ruff==0.15.4
      - name: Static checks
        run: |
          .venv/bin/ruff check engine scripts
          .venv/bin/ruff format --check engine scripts
          .venv/bin/python -m compileall -q engine scripts
          git diff --check
      - name: Engine tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=engine \
            .venv/bin/python -m unittest discover -s engine/tests -v
      - name: Installer and user-unit tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 \
            .venv/bin/python -m unittest discover -s scripts/tests -v
      - name: Shell syntax
        run: |
          bash -n \
            packaging/murmur-voice-daemon \
            packaging/open-voice-input-settings \
            scripts/build-preview-bundle.sh \
            scripts/install-user.sh \
            scripts/uninstall-user.sh

  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install voice test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gir1.2-gtk-4.0 \
            libportaudio2 \
            python3-gi \
            python3-venv \
            xvfb
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            pytest==9.0.2 \
            ruff==0.15.4
      - name: Voice static checks
        run: |
          .venv/bin/ruff check voice
          .venv/bin/ruff format --check voice
          git diff --check
      - name: Offline voice tests
        run: |
          xvfb-run -a env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=voice \
            .venv/bin/python -m pytest -q -p no:cacheprovider voice/tests
      - name: Build distributable voice wheel
        run: |
          .venv/bin/python -m pip wheel ./voice \
            --no-deps \
            --wheel-dir dist
      - name: Install and inspect voice wheel
        run: |
          python3 -m venv --system-site-packages .wheel-venv
          .wheel-venv/bin/python -m pip install --disable-pip-version-check \
            dist/*.whl
          .wheel-venv/bin/python -m pip check
          (cd /tmp && "$GITHUB_WORKSPACE"/.wheel-venv/bin/python -c \
            "import murmur_voice; print(murmur_voice.__version__)")
          .wheel-venv/bin/murmur-voice-daemon --help >/dev/null
          xvfb-run -a .wheel-venv/bin/open-voice-input-settings --help >/dev/null
          .wheel-venv/bin/python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.endswith("/licenses/LICENSE") for name in names)
          assert any(name.endswith("/licenses/NOTICE.md") for name in names)
          assert not any("__pycache__" in name or name.endswith(".pyc") for name in names)
          PY

  preview-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install preview build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gir1.2-gtk-4.0 \
            libportaudio2 \
            python3-gi \
            python3-venv
          python3 -m venv .venv
      - name: Build clean offline preview bundle
        run: |
          printf '%s\n' 'ignored-preview-sentinel' >.env
          mkdir -p voice/__pycache__
          printf '%s\n' 'ignored-preview-sentinel' >voice/__pycache__/local.pyc
          PREVIEW_PYTHON=.venv/bin/python \
            ./scripts/build-preview-bundle.sh --output-dir dist
      - name: Verify archive, wheelhouse, and mock install paths
        run: |
          .venv/bin/python scripts/verify_preview_bundle.py \
            dist/*.tar.gz \
            --source-repository . \
            --source-ref HEAD
          (cd dist && sha256sum --check *.tar.gz.sha256)
      - name: Upload offline Ubuntu x86_64 preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openVoiceInput_linux-preview-${{ github.sha }}-ubuntu-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

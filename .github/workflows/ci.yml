name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan current files and reachable Git history
        run: python3 scripts/scan_repository_secrets.py

  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            desktop-file-utils \
            gir1.2-ibus-1.0 \
            python3-gi \
            python3-venv \
            util-linux
      - name: Create isolated test environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --disable-pip-version-check ruff==0.15.4
      - name: Static checks
        run: |
          .venv/bin/ruff check engine scripts
          .venv/bin/ruff format --check engine scripts
          .venv/bin/python -m compileall -q engine scripts
          git diff --check
      - name: Engine tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=engine \
            .venv/bin/python -m unittest discover -s engine/tests -v
      - name: Installer and user-unit tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 \
            .venv/bin/python -m unittest discover -s scripts/tests -v
      - name: Shell syntax
        run: |
          bash -n \
            packaging/murmur-voice-daemon \
            packaging/open-voice-input-settings \
            scripts/build-preview-bundle.sh \
            scripts/install-user.sh \
            scripts/uninstall-user.sh

  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install voice test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            gir1.2-gtk-4.0 \
            libportaudio2 \
            python3-gi \
            python3-venv \
            xvfb
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            pytest==9.0.2 \
            ruff==0.15.4
      - name: Voice static checks
        run: |
          .venv/bin/ruff check voice
          .venv/bin/ruff format --check voice
          git diff --check
      - name: Offline voice tests
        run: |
          xvfb-run -a env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=voice \
            .venv/bin/python -m pytest -q -p no:cacheprovider voice/tests
      - name: Build distributable voice wheel
        run: |
          .venv/bin/python -m pip wheel ./voice \
            --no-deps \
            --wheel-dir dist
      - name: Install and inspect voice wheel
        run: |
          python3 -m venv --system-site-packages .wheel-venv
          .wheel-venv/bin/python -m pip install --disable-pip-version-check \
            dist/*.whl
          .wheel-venv/bin/python -m pip check
          (cd /tmp && "$GITHUB_WORKSPACE"/.wheel-venv/bin/python -c \
            "import murmur_voice; print(murmur_voice.__version__)")
          .wheel-venv/bin/murmur-voice-daemon --help >/dev/null
          xvfb-run -a .wheel-venv/bin/open-voice-input-settings --help >/dev/null
          .wheel-venv/bin/python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.endswith("/licenses/LICENSE") for name in names)
          assert any(name.endswith("/licenses/NOTICE.md") for name in names)
          assert not any("__pycache__" in name or name.endswith(".pyc") for name in names)
          PY

  preview-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install preview build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            desktop-file-utils \
            gir1.2-gtk-4.0 \
            libportaudio2 \
            python3-gi \
            python3-venv \
            util-linux
          python3 -m venv .venv
      - name: Build clean offline preview bundle twice
        run: |
          printf '%s\n' 'ignored-preview-sentinel' >.env
          mkdir -p voice/__pycache__
          printf '%s\n' 'ignored-preview-sentinel' >voice/__pycache__/local.pyc
          reproducibility_dir=$(mktemp -d \
            "$RUNNER_TEMP/openvoice-repro.XXXXXX")
          export REPRODUCIBILITY_DIR="$reproducibility_dir"
          PREVIEW_PYTHON=.venv/bin/python \
            ./scripts/build-preview-bundle.sh \
              --ref "$GITHUB_SHA" \
              --output-dir dist
          PREVIEW_PYTHON=.venv/bin/python \
            ./scripts/build-preview-bundle.sh \
              --ref "$GITHUB_SHA" \
              --output-dir "$REPRODUCIBILITY_DIR"
          .venv/bin/python -I - <<'PY'
          import filecmp
          import os
          from pathlib import Path

          directories = (Path("dist"), Path(os.environ["REPRODUCIBILITY_DIR"]))
          assets: list[tuple[Path, Path]] = []
          for directory in directories:
              entries = sorted(directory.iterdir())
              if any(entry.is_symlink() or not entry.is_file() for entry in entries):
                  raise SystemExit(f"unsafe preview output in {directory}")
              archives = [entry for entry in entries if entry.name.endswith(".tar.gz")]
              checksums = [
                  entry for entry in entries if entry.name.endswith(".tar.gz.sha256")
              ]
              if len(entries) != 2 or len(archives) != 1 or len(checksums) != 1:
                  raise SystemExit(f"unexpected preview assets in {directory}")
              if checksums[0].name != f"{archives[0].name}.sha256":
                  raise SystemExit(f"preview checksum name mismatch in {directory}")
              assets.append((archives[0], checksums[0]))

          for first, repeated in zip(assets[0], assets[1], strict=True):
              if first.name != repeated.name or not filecmp.cmp(
                  first, repeated, shallow=False
              ):
                  raise SystemExit("repeated preview build is not byte-identical")
          PY
          git diff --exit-code
      - name: Verify archive, wheelhouse, and mock install paths
        run: |
          .venv/bin/python scripts/verify_preview_bundle.py \
            dist/*.tar.gz \
            --source-repository . \
            --source-ref "$GITHUB_SHA"
          (cd dist && sha256sum --check *.tar.gz.sha256)
      - name: Upload offline Ubuntu x86_64 preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openVoiceInput_linux-preview-${{ github.sha }}-ubuntu-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
